<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Migration Runner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #0f3460;
        }
        button {
            background: #0f3460;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #1e5f8e;
        }
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        #output {
            background: #0f3460;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        .warning { color: #fbbf24; }
        .progress {
            width: 100%;
            height: 20px;
            background: #0f3460;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22d3ee);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <h1>🚀 Firebase Migration Runner</h1>
    
    <div class="container">
        <h2>📦 Migration Status</h2>
        <div id="status">Checking local data...</div>
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div id="progressText">Ready to start</div>
    </div>

    <div class="container">
        <h2>🎮 Migration Controls</h2>
        <button id="checkBtn" onclick="checkLocalData()">🔍 Check Local Data</button>
        <button id="migrateBtn" onclick="runMigration()" disabled>🚀 Run Migration</button>
        <button id="clearBtn" onclick="clearLocalStorage()">🧹 Clear LocalStorage</button>
    </div>

    <div class="container">
        <h2>📊 Migration Log</h2>
        <div id="output">Initializing migration runner...\n</div>
        <button onclick="clearOutput()">🧹 Clear Log</button>
    </div>

    <script type="module">
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCJKKDmmDsK0ihtvTJxDlq9MAbKPgRbTaw",
            authDomain: "tradedesk-ea98a.firebaseapp.com",
            projectId: "tradedesk-ea98a",
            storageBucket: "tradedesk-ea98a.firebasestorage.app",
            messagingSenderId: "839166731244",
            appId: "1:839166731244:web:18d7a2a6aa78f08d3a16c9",
            measurementId: "G-QG7H4HWKNK",
        };

        // Import Firebase SDK
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getFirestore, collection, doc, getDocs, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const output = document.getElementById('output');
        const statusDiv = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const migrateBtn = document.getElementById('migrateBtn');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        function updateProgress(percent, text) {
            progressBar.style.width = `${percent}%`;
            progressText.textContent = text;
        }

        function clearOutput() {
            output.innerHTML = 'Output cleared...\n';
        }

        function updateStatus(hasData, tradesCount, hasSettings) {
            if (hasData) {
                statusDiv.innerHTML = `
                    <div class="success">✅ Data ready for migration</div>
                    <div>📊 Trades: ${tradesCount} items</div>
                    <div>⚙️ Settings: ${hasSettings ? 'Found' : 'None'}</div>
                `;
                migrateBtn.disabled = false;
            } else {
                statusDiv.innerHTML = `
                    <div class="warning">⚠️ No local data found</div>
                    <div>Nothing to migrate</div>
                `;
                migrateBtn.disabled = true;
            }
        }

        async function checkLocalData() {
            log('🔍 Checking local storage data...', 'info');
            updateProgress(10, 'Checking local data...');
            
            try {
                const trades = localStorage.getItem('trades');
                const settings = localStorage.getItem('settings');
                
                const tradesCount = trades ? JSON.parse(trades).length : 0;
                const hasSettings = !!settings;
                const hasData = tradesCount > 0 || hasSettings;
                
                log(`📊 Local Data Summary:`, 'info');
                log(`- Trades: ${tradesCount} items`, tradesCount > 0 ? 'success' : 'warning');
                log(`- Settings: ${hasSettings ? 'Found' : 'None'}`, hasSettings ? 'success' : 'warning');
                
                if (tradesCount > 0) {
                    const sampleTrade = JSON.parse(trades)[0];
                    log(`📝 Sample trade: ${sampleTrade.symbol} @ $${sampleTrade.entry_price}`, 'info');
                }
                
                updateStatus(hasData, tradesCount, hasSettings);
                updateProgress(100, hasData ? 'Ready to migrate' : 'No data to migrate');
                
            } catch (error) {
                log(`❌ Error checking local data: ${error.message}`, 'error');
                updateProgress(0, 'Error checking data');
            }
        }

        async function runMigration() {
            log('🚀 Starting migration to Firebase...', 'info');
            migrateBtn.disabled = true;
            updateProgress(0, 'Starting migration...');
            
            try {
                // Get local data
                const tradesData = localStorage.getItem('trades');
                const settingsData = localStorage.getItem('settings');
                
                if (!tradesData && !settingsData) {
                    log('ℹ️ No data to migrate', 'warning');
                    updateProgress(100, 'No data to migrate');
                    return;
                }
                
                const trades = tradesData ? JSON.parse(tradesData) : [];
                const settings = settingsData ? JSON.parse(settingsData) : null;
                
                log(`📦 Migration Plan:`, 'info');
                log(`- Trades: ${trades.length} items`, 'success');
                log(`- Settings: ${settings ? '1 set' : 'None'}`, settings ? 'success' : 'warning');
                
                // Migrate trades
                if (trades.length > 0) {
                    log('🔄 Migrating trades...', 'info');
                    updateProgress(20, 'Migrating trades...');
                    
                    let migratedCount = 0;
                    for (let i = 0; i < trades.length; i++) {
                        const trade = trades[i];
                        try {
                            // Prepare trade data
                            const tradeData = {
                                ...trade,
                                created_date: serverTimestamp(),
                                updated_date: serverTimestamp()
                            };
                            
                            // Add to Firebase
                            const docRef = await addDoc(collection(db, 'trades'), tradeData);
                            migratedCount++;
                            
                            log(`✅ Migrated trade ${i + 1}/${trades.length}: ${trade.symbol}`, 'success');
                            updateProgress(20 + (60 * (i + 1) / trades.length), `Migrating trades... ${i + 1}/${trades.length}`);
                            
                        } catch (error) {
                            log(`❌ Failed to migrate trade ${trade.symbol}: ${error.message}`, 'error');
                        }
                    }
                    
                    log(`✅ Trades migration complete: ${migratedCount}/${trades.length}`, 'success');
                }
                
                // Migrate settings
                if (settings) {
                    log('🔄 Migrating settings...', 'info');
                    updateProgress(85, 'Migrating settings...');
                    
                    try {
                        const settingsData = {
                            ...settings,
                            updated_date: serverTimestamp()
                        };
                        
                        await addDoc(collection(db, 'settings'), settingsData);
                        log('✅ Settings migrated successfully', 'success');
                        updateProgress(95, 'Settings migrated');
                        
                    } catch (error) {
                        log(`❌ Failed to migrate settings: ${error.message}`, 'error');
                    }
                }
                
                updateProgress(100, 'Migration complete!');
                log('🎉 Migration completed successfully!', 'success');
                log('💡 Your data is now in Firebase', 'info');
                log('🧹 You can clear localStorage if everything looks good', 'info');
                
                // Update status
                statusDiv.innerHTML = `
                    <div class="success">🎉 Migration Complete!</div>
                    <div>✅ Data is now in Firebase</div>
                    <div>💡 Clear localStorage when ready</div>
                `;
                
            } catch (error) {
                log(`💥 Migration failed: ${error.message}`, 'error');
                updateProgress(0, 'Migration failed');
                migrateBtn.disabled = false;
            }
        }

        function clearLocalStorage() {
            if (confirm('Are you sure you want to clear all local data? This cannot be undone.')) {
                localStorage.removeItem('trades');
                localStorage.removeItem('settings');
                log('🧹 LocalStorage cleared', 'success');
                checkLocalData(); // Re-check status
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            log('🚀 Firebase Migration Runner Ready', 'success');
            log('💡 Click "Check Local Data" to begin', 'info');
            checkLocalData();
        });
    </script>
</body>
</html>
